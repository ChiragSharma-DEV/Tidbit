  <path d="M220 130C220 118.954 228.954 110 240 110H370C392.091 110 410 127.909 410 150V290C410 312.091 392.091 330 370 330H240C228.954 330 220 321.046 220 310V130Z" fill="#E8B8A6"/>
  
  <!-- Stylized Bookmark Negative Space Flake -->
  <path d="M245 320C245 285 290 270 330 215C345 235 345 290 325 320H245Z" fill="#FAF7F2"/>
  
  <!-- 3 Reading Rhythm Lines -->
  <line x1="250" y1="355" x2="395" y2="355" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="375" x2="395" y2="375" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="395" x2="395" y2="395" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  

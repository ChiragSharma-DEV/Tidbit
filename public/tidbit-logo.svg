  <!-- Tagline -->
  <text x="250" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#6B7280">SMALL READS. BIG THOUGHTS.</text>

<body class="bg-background text-on-surface min-h-screen flex flex-col font-article-body-mobile selection:bg-primary-container selection:text-on-primary-container">
<main class="flex-grow px-margin-page pt-12 pb-32 flex flex-col max-w-2xl mx-auto w-full">
<header class="mb-stack-lg">
<div class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-stack-md tracking-[0.15em]">
                STEP 1 OF 2
            </div>
<h1 class="font-display-lg-mobile text-display-lg-mobile mb-stack-sm text-on-background">
                What do you want to<br/>get deeper into?
            </h1>
<p class="font-article-body-mobile text-article-body-mobile text-on-surface-variant">
                Pick three or four. You can change these later.
            </p>
</header>
<div class="mb-stack-lg">
<div class="relative flex items-center border-b border-outline-variant pb-2">
<span class="material-symbols-outlined text-outline mr-2" style="font-variation-settings: 'FILL' 0;">search</span>
<input autocomplete="off" class="w-full bg-transparent border-none p-0 focus:ring-0 font-article-body-mobile text-article-body-mobile text-on-surface placeholder:text-on-surface-variant outline-none" placeholder="Search topics" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-3 mb-stack-lg">
<button class="px-4 py-3 rounded border border-primary bg-primary text-on-primary font-ui-button text-ui-button text-center transition-colors">
                Psychology
            </button>
<button class="px-4 py-3 rounded border border-primary bg-primary text-on-primary font-ui-button text-ui-button text-center transition-colors">
                AI &amp; Tech
            </button>
<button class="px-4 py-3 rounded border border-primary bg-primary text-on-primary font-ui-button text-ui-button text-center transition-colors">
                Marketing
            </button>
<button class="px-4 py-3 rounded border border-primary bg-primary text-on-primary font-ui-button text-ui-button text-center transition-colors">
                Writing
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Business
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Money
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Space
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Health
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Philosophy
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Design
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                History
            </button>
<button class="px-4 py-3 rounded border border-outline-variant bg-surface text-on-surface font-ui-button text-ui-button text-center hover:border-primary hover:text-primary transition-colors">
                Habits
            </button>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full bg-background px-margin-page pb-8 pt-4 z-50 max-w-2xl mx-auto left-1/2 -translate-x-1/2">
<button class="w-full bg-primary text-on-primary py-4 rounded font-ui-button text-ui-button text-center flex items-center justify-center transition-opacity hover:opacity-90">
            Continue
        </button>
<div class="text-center mt-3 font-label-mono text-[11px] text-on-surface-variant uppercase tracking-[0.1em]">
            4 SELECTED
        </div>
</div>
<script>
        document.querySelectorAll('.grid button').forEach(button => {
            button.addEventListener('click', function() {
                const isSelected = this.classList.contains('bg-primary');
                if (isSelected) {
                    this.classList.remove('bg-primary', 'border-primary', 'text-on-primary');
                    this.classList.add('bg-surface', 'border-outline-variant', 'text-on-surface');
                } else {
                    this.classList.remove('bg-surface', 'border-outline-variant', 'text-on-surface');
                    this.classList.add('bg-primary', 'border-primary', 'text-on-primary');
                }
                
                const selectedCount = document.querySelectorAll('.grid button.bg-primary').length;
                const counterText = document.querySelector('.fixed.bottom-0 .text-center');
                if(counterText) {
                    counterText.textContent = `${selectedCount} SELECTED`;
                }
            });
        });
    </script>
</body></html>

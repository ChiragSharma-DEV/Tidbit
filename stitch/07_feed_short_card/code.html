<body class="bg-[#F4F4F0] min-h-screen flex flex-col font-sans-custom">
<!-- Header -->
<header class="flex justify-between items-center px-6 pt-12 pb-4">
<h1 class="font-display-lg-mobile text-[20px] text-on-background m-0 p-0 leading-none">Tidbit</h1>
<div class="flex flex-col items-end">
<span class="font-label-mono text-[10px] text-graphite uppercase tracking-widest mb-1">STAMINA 34</span>
<div class="w-10 h-[2px] bg-[#DFDFD7] relative">
<div class="absolute left-0 top-0 h-full bg-ink-blue w-1/5"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-6 pb-24 relative">
<!-- The Card -->
<article class="bg-white custom-border border border-solid rounded h-[486px] flex flex-col relative overflow-hidden">
<!-- Left Gutter & Ruler -->
<div class="absolute left-0 top-0 bottom-0 w-[28px] border-r custom-border border-solid bg-white flex justify-center pt-8">
<div class="w-[2px] h-[80%] bg-[#DFDFD7] relative">
<div class="absolute top-0 left-0 w-full bg-ink-blue" style="height: 20%;"></div>
<!-- Tick Marks -->
<div class="absolute w-[6px] h-[1px] bg-[#DFDFD7] -left-[2px] top-1/4"></div>
<div class="absolute w-[6px] h-[1px] bg-[#DFDFD7] -left-[2px] top-2/4"></div>
<div class="absolute w-[6px] h-[1px] bg-[#DFDFD7] -left-[2px] top-3/4"></div>
</div>
</div>
<!-- Card Content Area -->
<div class="ml-[28px] p-6 flex flex-col h-full">
<div class="flex-grow flex flex-col">
<span class="font-label-mono text-[11px] text-graphite tracking-[0.15em] uppercase mb-4 block">AI &amp; TECH · 31 WORDS</span>
<h2 class="font-display-lg-mobile text-[28px] text-on-background leading-[1.1] tracking-[-0.03em] mb-4">Small models are eating the easy jobs</h2>
<p class="font-article-body-mobile text-[18px] text-on-surface-variant leading-[1.6]">
                        A three-billion-parameter model runs on your phone, answers in under a second, and costs almost nothing. It will not write your novel. It does not need to.
                    </p>
</div>
<div class="mt-auto">
<hr class="custom-border border-t border-solid mb-4 w-full"/>
<span class="font-sans-custom text-[14px] ink-blue font-medium">Narrow work is cheap work.</span>
</div>
</div>
</article>
<!-- Post-Card Actions -->
<div class="flex justify-between items-center mt-6 px-2">
<button class="font-sans-custom text-[13px] text-graphite bg-transparent border-none p-0 cursor-pointer hover:text-[#2F2BC4] transition-colors">Save</button>
<button class="font-sans-custom text-[13px] text-graphite bg-transparent border-none p-0 cursor-pointer hover:text-[#2F2BC4] transition-colors">Share</button>
<button class="font-sans-custom text-[13px] text-graphite bg-transparent border-none p-0 cursor-pointer hover:text-[#2F2BC4] transition-colors">Less like this</button>
</div>
</main>

<body class="bg-surface-container-low min-h-screen text-on-background pb-32">
<!-- Header Section -->
<header class="px-margin-page pt-12 pb-stack-lg flex flex-col gap-stack-md">
<div class="font-label-mono text-label-mono text-secondary uppercase">Step 2 of 2</div>
<div class="flex flex-col gap-stack-sm">
<h1 class="font-headline-md text-headline-md text-on-background">Let's find your starting length.</h1>
<p class="font-article-body-mobile text-article-body-mobile text-secondary">Read these three. Tap the one that feels comfortable.</p>
</div>
</header>
<!-- Cards Container -->
<main class="px-margin-page flex flex-col gap-stack-md">
<!-- Short Card (30 Words) -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded p-6 flex flex-row group transition-colors duration-200">
<div class="w-gutter-ruler flex-shrink-0 relative flex justify-center h-full min-h-[80px]">
<div class="w-[2px] bg-outline-variant absolute top-0 bottom-0 opacity-50"></div>
<div class="w-[2px] bg-primary-container absolute top-0 transition-all duration-300 group-hover:h-full" style="height: 20%;"></div>
</div>
<div class="flex-1 pl-4 flex flex-col gap-3">
<span class="font-label-mono text-label-mono text-secondary uppercase">30 Words</span>
<p class="font-article-body-mobile text-article-body-mobile text-on-background line-clamp-3">Attention is the most precious resource we have. When we give it freely to the noise, we rob ourselves of the silence needed to think deeply.</p>
</div>
</button>
<!-- Medium Card (140 Words) - Selected State -->
<button class="w-full text-left bg-surface-container-lowest border-y border-r border-outline-variant border-l-[3px] border-l-primary-container rounded p-6 flex flex-row">
<div class="w-gutter-ruler flex-shrink-0 relative flex justify-center h-full min-h-[140px]">
<div class="w-[2px] bg-outline-variant absolute top-0 bottom-0 opacity-50"></div>
<div class="w-[2px] bg-primary-container absolute top-0" style="height: 50%;"></div>
</div>
<div class="flex-1 pl-4 flex flex-col gap-3">
<span class="font-label-mono text-label-mono text-primary-container uppercase">140 Words</span>
<p class="font-article-body-mobile text-article-body-mobile text-on-background">The modern digital landscape is engineered for interruption. Every notification, infinite scroll, and algorithmic feed is designed to fragment our focus and keep us in a state of continuous partial attention. By stepping away from the stream, we reclaim our cognitive sovereignty. We begin to remember what it feels like to sit with a single thought.</p>
</div>
</button>
<!-- Tall Card (420 Words) -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded p-6 flex flex-row group transition-colors duration-200 opacity-80 hover:opacity-100">
<div class="w-gutter-ruler flex-shrink-0 relative flex justify-center h-full min-h-[200px]">
<div class="w-[2px] bg-outline-variant absolute top-0 bottom-0 opacity-50"></div>
<div class="w-[2px] bg-primary-container absolute top-0 transition-all duration-300 group-hover:h-full" style="height: 90%;"></div>
</div>
<div class="flex-1 pl-4 flex flex-col gap-3">
<span class="font-label-mono text-label-mono text-secondary uppercase">420 Words</span>
<p class="font-article-body-mobile text-article-body-mobile text-on-background">Technology was originally envisioned as a bicycle for the mind, a tool to amplify our innate capabilities and expand the horizons of human thought. Yet, somewhere along the rapid progression of the information age, the tool began to wield the user. The architecture of the web transitioned from a library of indexed knowledge into a casino of behavioral conditioning. Reversing this dynamic requires more than just willpower; it demands structurally redesigning our relationship with information and deliberately cultivating an environment of quiet focus.</p>
</div>
</button>
</main>
<!-- Pinned Footer Action -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-low/90 backdrop-blur-sm border-t border-outline-variant/30 px-margin-page py-6 flex flex-col gap-4 z-50">

      We'll adjust as you go.
    </p>
</footer>
